# Reject direct IP access and unknown hostnames.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Redirect domain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name indukuru.online www.indukuru.online;
    return 301 https://indukuru.online$request_uri;
}

# Serve the app only on the festival domain over HTTPS.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name indukuru.online www.indukuru.online;

    ssl_certificate /etc/letsencrypt/live/indukuru.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indukuru.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16M;
    }
}
