{% extends "base.html" %}

{% block title %}Reset Password - {{ platform_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 auth-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="hero-icon-sm">📱</div>
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-muted small mb-0">
                        OTP will be sent to <strong>{{ masked_phone }}</strong>
                    </p>
                </div>

                <div id="resetAuthError" class="alert alert-danger py-2 d-none" role="alert"></div>
                <div id="resetAuthInfo" class="alert alert-info py-2 d-none" role="status"></div>

                <div id="msg91Captcha" class="mb-3"></div>

                <div id="otpSendStep">
                    <button type="button" id="sendResetOtpBtn" class="btn btn-festival btn-lg w-100 mb-2" disabled>
                        Loading OTP service…
                    </button>
                </div>

                <div id="otpVerifyStep" class="d-none">
                    <div class="mb-3">
                        <label class="form-label" for="resetOtp">Enter OTP</label>
                        <input type="text" id="resetOtp" class="form-control form-control-lg"
                               inputmode="numeric" maxlength="6" placeholder="6-digit OTP" autocomplete="one-time-code">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="resetPassword">New Password</label>
                        <div class="password-toggle-wrap">
                            <input type="password" id="resetPassword" class="form-control form-control-lg" minlength="6">
                            <button type="button" class="password-toggle-btn" data-password-toggle="resetPassword" aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="resetPasswordConfirm">Confirm New Password</label>
                        <input type="password" id="resetPasswordConfirm" class="form-control form-control-lg" minlength="6">
                    </div>
                    <button type="button" id="completeResetBtn" class="btn btn-festival btn-lg w-100 mb-2">
                        Update Password
                    </button>
                    <button type="button" id="resendResetOtpBtn" class="btn btn-link w-100">
                        Resend OTP
                    </button>
                </div>

                <div class="text-center mt-4">
                    <a href="{{ url_for('auth.forgot_password') }}">Start over</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.passwordResetConfig = {
    completeUrl: {{ url_for('auth.forgot_password_complete')|tojson }},
    widgetId: {{ msg91_widget.widget_id|tojson }},
    widgetToken: {{ msg91_widget.widget_token|tojson }},
    identifier: {{ widget_identifier|tojson }}
  };
</script>
<script src="{{ url_for('static', filename='js/forgot-password-otp.js') }}"></script>
{% endblock %}
