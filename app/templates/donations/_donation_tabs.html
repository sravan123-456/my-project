<div class="donation-main-tabs mb-4" role="tablist" aria-label="{{ t('donations.title') }}">
    <a class="donation-main-tab{% if active_tab == 'received' %} active{% endif %}"
       href="{{ url_for('donations.list_donations') }}"
       role="tab"{% if active_tab == 'received' %} aria-selected="true"{% endif %}>
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ t('donations.tab_received') }}</span>
    </a>
    <a class="donation-main-tab{% if active_tab == 'pledges' %} active{% endif %}"
       href="{{ url_for('pledges.list_pledges') }}"
       role="tab"{% if active_tab == 'pledges' %} aria-selected="true"{% endif %}>
        <i class="bi bi-hourglass-split"></i>
        <span>{{ t('donations.tab_pledges') }}</span>
        {% if pending_pledge_count and pending_pledge_count > 0 %}
        <span class="badge rounded-pill bg-warning text-dark">{{ pending_pledge_count }}</span>
        {% endif %}
    </a>
</div>
