{% if committee_payment_qr_url() %}
<div class="payment-qr-card card border-0 shadow-sm mb-4">
    <div class="card-body text-center">
        <h5 class="fw-semibold mb-1"><i class="bi bi-qr-code text-success"></i> {{ t('donations.qr_title') }}</h5>
        <p class="text-muted small mb-3">{{ t('donations.qr_hint') }}</p>
        <a href="#" class="payment-qr-link d-inline-block" data-lightbox
           data-src="{{ committee_payment_qr_url() }}" data-alt="{{ t('donations.qr_title') }}"
           data-caption="{{ t('donations.qr_title') }}">
            <img src="{{ committee_payment_qr_url() }}" alt="{{ t('donations.qr_title') }}" class="payment-qr-image">
        </a>
        <p class="small text-muted mt-2 mb-0">{{ t('donations.qr_tap') }}</p>
    </div>
</div>
{% endif %}
