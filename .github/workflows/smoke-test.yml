name: Smoke Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "README.md"
      - "DEPLOYMENT.md"
      - "BOOTSTRAP.md"
      - "POST_DEPLOY_CHECKLIST.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "README.md"
      - "DEPLOYMENT.md"
      - "BOOTSTRAP.md"
      - "POST_DEPLOY_CHECKLIST.md"

concurrency:
  group: smoke-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-in-app:
    name: In-app smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: false

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Prepare CI environment
        run: mkdir -p /tmp/dansetu-uploads

      - name: Run smoke tests (Flask test client)
        env:
          SECRET_KEY: ci-smoke-test-secret-key
          DATABASE_URL: sqlite:////tmp/dansetu-ci-smoke.db
          UPLOAD_FOLDER: /tmp/dansetu-uploads
          FLASK_ENV: testing
        run: |
          python scripts/smoke_test.py
          echo "All smoke tests passed."

      - name: Summary
        if: always()
        run: |
          echo "## Smoke tests (in-app)" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates routes, database migrations, and static assets using the Flask test client." >> "$GITHUB_STEP_SUMMARY"
