name: Terraform Provision (reusable)

on:
  workflow_call:
    inputs:
      gcp_project_id:
        description: GCP project ID
        required: true
        type: string
      gcp_region:
        description: GCP region
        required: false
        type: string
        default: us-central1
      gcp_zone:
        description: GCP zone
        required: false
        type: string
        default: us-central1-a
      vm_name:
        description: VM instance name
        required: false
        type: string
        default: vinayaka-festival
      domain_name:
        description: Public domain for the app
        required: true
        type: string
      github_repo_url:
        description: Git repo URL cloned on the VM
        required: false
        type: string
        default: https://github.com/sravan123-456/my-project.git
      ssh_user:
        description: Linux SSH user on the VM
        required: false
        type: string
        default: vandana
      tfstate_bucket:
        description: GCS bucket for Terraform state
        required: false
        type: string
        default: ""
      skip_health_check:
        description: Skip HTTPS health check after apply
        required: false
        type: boolean
        default: false
    secrets:
      GCP_SA_KEY:
        required: true
      SECRET_KEY:
        required: true
      SSH_PUBLIC_KEY:
        required: true

jobs:
  provision:
    name: Terraform Apply
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ inputs.gcp_project_id }}
      GCP_ZONE: ${{ inputs.gcp_zone }}
      GCE_INSTANCE: ${{ inputs.vm_name }}
      TF_DIR: terraform
      DOMAIN_NAME: ${{ inputs.domain_name }}
      TFSTATE_BUCKET: ${{ inputs.tfstate_bucket != '' && inputs.tfstate_bucket || format('{0}-vinayaka-tfstate', inputs.gcp_project_id) }}
      CICD_SA_EMAIL: github-actions@${{ inputs.gcp_project_id }}.iam.gserviceaccount.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Write terraform.tfvars
        working-directory: ${{ env.TF_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id      = "${GCP_PROJECT}"
          region          = "${{ inputs.gcp_region }}"
          zone            = "${GCP_ZONE}"
          vm_name         = "${GCE_INSTANCE}"
          machine_type    = "e2-micro"
          boot_disk_size_gb = 10
          app_port        = 8080
          domain_name     = "${DOMAIN_NAME}"
          github_repo_url = "${{ inputs.github_repo_url }}"
          ssh_user        = "${{ inputs.ssh_user }}"
          cicd_service_account_email = "${CICD_SA_EMAIL}"
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${TFSTATE_BUCKET}" \
            -backend-config="prefix=terraform/state"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve -input=false

      - name: Show outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          IP="$(terraform output -raw dns_a_record_value)"
          echo "## Terraform outputs" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project:** ${GCP_PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VM:** ${GCE_INSTANCE} (${GCP_ZONE})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Static IP (DNS A record):** ${IP}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Domain:** ${DOMAIN_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App URL:** https://${DOMAIN_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Firebase auth domain:** $(terraform output -raw firebase_auth_domain)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Point your domain **${DOMAIN_NAME}** A record to **${IP}** if not already done." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for app
        if: ${{ !inputs.skip_health_check }}
        run: |
          URL="https://${DOMAIN_NAME}/health"
          echo "Polling ${URL} for up to 3 min..."
          for i in $(seq 1 36); do
            if curl -sSf -m 5 "${URL}" > /dev/null; then
              echo "App is up at https://${DOMAIN_NAME}"
              exit 0
            fi
            sleep 5
          done
          echo "App did not respond yet (DNS/SSL may still be propagating). Continue with deploy step." >&2
