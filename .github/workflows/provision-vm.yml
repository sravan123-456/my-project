name: Provision GCP VM (Terraform)

on:
  workflow_dispatch:

concurrency:
  group: vinayaka-terraform
  cancel-in-progress: false

env:
  GCP_PROJECT: business-account-506411
  GCP_ZONE: us-central1-a
  GCE_INSTANCE: vinayaka-festival
  TF_DIR: terraform

jobs:
  provision:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Write terraform.tfvars
        working-directory: ${{ env.TF_DIR }}
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id      = "${GCP_PROJECT}"
          region          = "us-central1"
          zone            = "${GCP_ZONE}"
          vm_name         = "${GCE_INSTANCE}"
          machine_type    = "e2-micro"
          boot_disk_size_gb = 10
          app_port        = 8080
          secret_key      = "${SECRET_KEY}"
          github_repo_url = "https://github.com/sravan123-456/my-project.git"
          ssh_user        = "vandana"
          ssh_public_key  = "${SSH_PUBLIC_KEY}"
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Show outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "## Deployment URLs" >> "$GITHUB_STEP_SUMMARY"
          echo "- App URL: $(terraform output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- VM IP: $(terraform output -raw vm_external_ip)" >> "$GITHUB_STEP_SUMMARY"

      - name: Reset VM to run startup script
        run: |
          gcloud compute instances reset "${GCE_INSTANCE}" \
            --zone "${GCP_ZONE}" \
            --project "${GCP_PROJECT}"

      - name: Wait for app
        run: |
          IP=$(gcloud compute instances describe "${GCE_INSTANCE}" \
            --zone "${GCP_ZONE}" --project "${GCP_PROJECT}" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Polling http://${IP}:8080 for up to 8 min..."
          for i in $(seq 1 96); do
            if curl -sSf -m 5 "http://${IP}:8080" > /dev/null; then
              echo "App is up at http://${IP}:8080"
              exit 0
            fi
            sleep 5
          done
          echo "App did not respond in time. Check VM logs: sudo tail -f /var/log/vinayaka-startup.log" >&2
          exit 1
