name: Deploy Application to GCP VM

on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: GCP project ID
        required: false
        type: string
        default: business-account-506411
      domain_name:
        description: Public domain
        required: false
        type: string
        default: indukuru.online
      gcp_zone:
        description: GCP zone
        required: false
        type: string
        default: us-central1-a
      vm_name:
        description: VM name
        required: false
        type: string
        default: vinayaka-festival
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "README.md"
      - "DEPLOYMENT.md"
      - "BOOTSTRAP.md"

concurrency:
  group: vinayaka-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      gcp_project_id: ${{ github.event.inputs.gcp_project_id || 'business-account-506411' }}
      gcp_zone: ${{ github.event.inputs.gcp_zone || 'us-central1-a' }}
      vm_name: ${{ github.event.inputs.vm_name || 'vinayaka-festival' }}
      domain_name: ${{ github.event.inputs.domain_name || 'indukuru.online' }}
    secrets: inherit
