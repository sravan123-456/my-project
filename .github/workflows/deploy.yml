name: Deploy Application to GCP VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "README.md"
      - "DEPLOYMENT.md"

concurrency:
  group: vinayaka-app-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: business-account-506411
  GCP_ZONE: us-central1-a
  GCE_INSTANCE: vinayaka-festival
  APP_DIR: /opt/vinayaka-festival
  APP_DOMAIN: indukuru.online

jobs:
  deploy:
    name: Deploy Docker App
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Deploy latest code on VM
        run: |
          gcloud compute ssh "${GCE_INSTANCE}" \
            --zone "${GCP_ZONE}" \
            --project "${GCP_PROJECT}" \
            --quiet \
            --command="set -e
              APP_DIR='${APP_DIR}'
              if [ ! -d \"\${APP_DIR}/.git\" ]; then
                sudo mkdir -p \"\${APP_DIR}\"
                sudo git clone https://github.com/sravan123-456/my-project.git \"\${APP_DIR}\"
              fi
              sudo chown -R \$USER:\$USER \"\${APP_DIR}\"
              git config --global --add safe.directory \"\${APP_DIR}\"
              cd \"\${APP_DIR}\"
              git fetch origin main
              git reset --hard origin/main
              chmod +x scripts/deploy.sh
              sudo APP_DIR=\"\${APP_DIR}\" ./scripts/deploy.sh"

      - name: Show app URL
        run: |
          echo "## App deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Open: https://${APP_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        run: |
          URL="https://${APP_DOMAIN}/health"
          echo "Waiting for app at ${URL}..."
          for attempt in $(seq 1 24); do
            if curl -sSf -m 10 "${URL}" > /dev/null; then
              echo "Health check passed on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt} failed (app still starting), retrying in 5s..."
            sleep 5
          done
          echo "Health check failed: app did not respond after 2 minutes"
          exit 1
